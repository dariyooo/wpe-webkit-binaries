name: Check upstream

on:
  schedule:
    # Mondays, 05:00 UTC
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      # GitHub evicts a cache unused for 7 days, and releases are weeks apart.
      # Restoring the newest one of each architecture counts as a use.
      - name: Keep the x64 compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache-x64
          key: ccache-x64-keep-alive
          restore-keys: ccache-x64-
      - name: Keep the arm64 compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache-arm64
          key: ccache-arm64-keep-alive
          restore-keys: ccache-arm64-

      - name: Move versions.env to the newest stable releases
        id: check
        run: ./check_upstream.sh

      # GitHub turns a schedule off after 60 days without a commit, so every
      # check leaves one, with the versions it found. A push by the workflow
      # token starts no workflow, so the build is dispatched.
      - name: Log the check, commit and build
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.check.outputs.changed }}
        run: |
          versions="$(grep -E '^[A-Z_]+_VERSION=' versions.env | tr '\n' ' ')"
          wpe="$(grep -E '^WPE_VERSION=' versions.env | cut -d= -f2)"
          mkdir -p build_logs
          echo "$(date -u '+%F %H:%M') ${versions}$([ "$CHANGED" = 1 ] && echo '(new, building)')" \
            >> build_logs/check_upstream.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.env build_logs/check_upstream.log
          if [ "$CHANGED" = 1 ]; then
            git commit -m "chore: build WPE WebKit $wpe"
          else
            git commit -m "chore: WPE WebKit $wpe is still the newest"
          fi
          git push
          if [ "$CHANGED" = 1 ]; then
            gh workflow run build.yml --ref "${{ github.ref_name }}"
          fi
